<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPORT HUB — Live Business Reporting</title>
<link rel="stylesheet" href="css/dashboard.css">
<link href="https://unpkg.com/tabulator-tables@6.2.5/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">RH</div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">REPORT HUB</div>
        <div class="brand-sub" id="brandSub">Live Business Reporting</div>
      </div>
    </div>
    <nav id="navMenu" class="nav-menu"></nav>
    <div class="sidebar-footer">
      <div class="version" id="appVersion">v1.0.0</div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button id="menuToggle" class="icon-btn" aria-label="Toggle menu">☰</button>
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="topbar-actions">
        <span id="globalStatus" class="status-pill status-nodata">● No Data</span>
        <button id="refreshAllBtn" class="btn btn-primary">⟳ Refresh All Data</button>
      </div>
    </header>
    <main id="mainContent" class="main-content"></main>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Column Manager Modal -->
<div id="colManagerModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Choose Table Columns</h3>
      <button class="icon-btn" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <div class="col-manager-hint">Toggle visibility and drag to reorder. Changes apply to the current view.</div>
      <ul id="colManagerList" class="col-manager-list"></ul>
    </div>
    <div class="modal-footer">
      <button class="btn" id="colResetBtn">Restore Default</button>
      <button class="btn btn-primary" id="colApplyBtn">Apply</button>
    </div>
  </div>
</div>

<!-- Advanced Filter Modal -->
<div id="advFilterModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Advanced Filters</h3>
      <button class="icon-btn" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <div id="advFilterRows"></div>
      <button class="btn" id="advAddRow">+ Add Condition</button>
    </div>
    <div class="modal-footer">
      <button class="btn" id="advClearBtn">Clear All Filters</button>
      <button class="btn btn-primary" id="advApplyBtn">Apply Filters</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/data-source.js"></script>
<script src="js/datatable.js"></script>
<script src="js/charts.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
